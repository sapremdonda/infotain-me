plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sapremdonda.infotainme'
    compileSdk 36

    // CI build number, so each build is a newer version than the last.
    def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

    defaultConfig {
        applicationId 'com.sapremdonda.infotainme'
        minSdk 26
        targetSdk 36
        versionCode Math.max(1, buildNumber)
        versionName "0.1.${buildNumber}"
    }

    // Personal sideloaded app: every build is signed with the same key in the repo,
    // so a newer APK installs over the old one instead of failing on a key mismatch.
    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.car.app:app:1.7.0'
}
